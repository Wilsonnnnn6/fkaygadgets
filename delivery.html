<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gadget Store - Delivery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="brand" href="index.html">Fkay Gadget Store</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Listings</a>
          <a href="cart.html">Cart <span data-cart-count class="badge">0</span></a>
          <a class="active" href="delivery.html">Delivery</a>
          <a href="payment.html">Payment</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-title">
        <div class="container">
          <h1>Delivery Details</h1>
          <p class="muted">Enter your address before checkout.</p>
        </div>
      </section>

      <section class="section">
        <div class="container layout-2">
          <div class="card">
            <form id="delivery-form">
              <div>
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName" required />
              </div>
              <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div>
                <label for="phone">Phone</label>
                <input id="phone" name="phone" required />
              </div>
              <div>
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
              </div>
              <div>
                <label for="city">City</label>
                <input id="city" name="city" required />
              </div>
              <div>
                <label for="state">State</label>
                <input id="state" name="state" required />
              </div>
              <button class="button button-secondary" type="submit">Save Delivery Info</button>
              <p id="delivery-status" class="success"></p>
            </form>
          </div>
          <aside class="card">
            <h3>Next Step</h3>
            <p class="muted">
              After saving delivery details, go to the payment page and pay with
              Flutterwave.
            </p>
            <a class="button button-secondary" href="payment.html">Go to Payment</a>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">BlueWave Gadget Store</div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
